workflows:
  chouhan-star-android:
    name: CHOUHAN STAR v2.2.8 Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Run Unit & Robolectric Tests
        script: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build Debug APK
        script: ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
