name: CHOUHAN STAR v2.2.8 - Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK & Run Unit Tests
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Unsigned Fallback)
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Package CHOUHAN STAR v2.2.8 APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CHOUHAN-STAR-V2.2.8-Code228-by-Dayaram-Chouhan.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk CHOUHAN-STAR-V2.2.8-Release-Unsigned.apk
          fi
          ls -lh *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHOUHAN-STAR-V2.2.8-APKs
          path: |
            CHOUHAN-STAR-V2.2.8-Code228-by-Dayaram-Chouhan.apk
            CHOUHAN-STAR-V2.2.8-Release-Unsigned.apk
          retention-days: 30

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.2.8
          name: CHOUHAN STAR v2.2.8 (Code 228) - 100% Free Lifetime
          body: |
            CHOUHAN STAR v2.2.8 (Code 228) by Dayaram Chouhan
            Native Android Kotlin + Jetpack Compose + Room + AES-256 Vault
            100% Free Forever • Zero Ads • Zero Tracking
          files: |
            CHOUHAN-STAR-V2.2.8-Code228-by-Dayaram-Chouhan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
