name: Build CHOUHAN STAR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename APK to CHOUHAN STAR
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk CHOUHAN-STAR-v1.0-by-Dayaram-Chouhan.apk
        cp app/build/outputs/apk/release/app-release-unsigned.apk CHOUHAN-STAR-Source-Release.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CHOUHAN-STAR-APK
        path: |
          CHOUHAN-STAR-v1.0-by-Dayaram-Chouhan.apk
          CHOUHAN-STAR-Source-Release.apk

    - name: Create Release and Upload APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0-LIFETIME
        name: CHOUHAN STAR v1.0 - 100% Free Forever
        body: |
          JAI SHRI RAM ⭐
          CHOUHAN STAR v1.0 by Dayaram Chouhan
          100% Free Forever - isPremium = true hardcoded
          Zero Payment - Original Edition
          JAI MATA DI 🚩
        files: |
          CHOUHAN-STAR-v1.0-by-Dayaram-Chouhan.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
